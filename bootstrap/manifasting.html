<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
  
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200">
    
    <div id="loginPage" class="min-vh-100 d-flex justify-content-center align-items-center px-3">
        <div class="bg-white rounded-4 shadow-lg p-4 p-md-5 w-100 max-w-md">
            <h1 class="text-center text-4xl font-bold text-blue-600 mb-2 text-outline-secondary">My Website</h1>
            <p class="text-center text-gray-500 mb-4">Login to your account</p>
            <form onsubmit="login(event)">
                <input type="email" id="email" class="form-control mb-3" placeholder="email" required>
                <input type="password" id="password" class="form-control mb-3" placeholder="password" required>
                <div class="text-end mb-4">
                    <a href="forget.html">
                        <button type="button" onclick="forgotpassword()" class="boarder-0 bg-transparent text-blue-600 text-decoration-underline uppercase text-sm">forgotpassword?</button>
                    </a>
                        
                    
                </div>     
                
                <a href="linked.html">
                    <button type="button" class="btn btn-transparent w-100 text-light fw-semibold bg-blue-600 px-6 btn-outline-primary">Login</button>
                </a> 
                    
            </form>
        </div>
    </div>
    
        
</body>
</html>
