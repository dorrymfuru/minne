    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

<body>
    <div id="Registration" class="min-vh-100 d-flex justify-content-center bg-gray-200 ">
        <div class="bg-gray-300 rounded-4 shadow-lg p-4 p-md-5 w-100 max-w-md">
            
            <form onsubmit="forgotpassword(event)">
                <p class="text-base text-left text-secondary ml-2 mb-2">If you forget your password<br>you have to enter and confirm your new password</p>
                <p class="text-sm text-gray-400 mb-2">enter new password</p>
                <input type="password" id="password" class="form-control">
                <p class="text-sm text-gray-400 mb-2 mt-4">confirm new password</p>
                <input type="password" id="password" class="form-control">
                <button type="button" class="btn btn-transparent w-20 text-secondary fw-bold bg-cyan-800 px-6 btn-outline-primary mt-10 ">SAVE</button>
                

            </form>
