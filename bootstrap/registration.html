<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
     <div id="Registration" class="min-vh-100 d-flex justify-content-center align-items-center bg-gray-200 ">
        <div class="bg-gray-400 rounded-4 shadow-lg p-4 p-md-5 w-100 max-w-md">
            <h1 class="text center text-3xl font-bold text-blue-600 mb-2 ps-[50px] text-outline-warning">Registration Form</h1>
            <p class="text-center text-gray-500 mb-4">enter your information below</p>
            <form onsubmit="registration(event)">
                <p class="text-sm text-secondary">First name</p>
                <input type="name" id="name" class="form-control mb-5" input-outline-success required>
                <p class="text-sm text-secondary">Last name</p>
                <input type="name" id="name" class="form-control mb-5" required>
                <p class="text-sm text-secondary">Phone</p>
                <input type="1" id="interger" class="form-control mb-5" required>
                <p class="text-sm text-secondary">Address</p>
                <input type="address" id="name" class="form-control mb-5" required>
                <button type="button" class="btn btn-transparent w-30 text-secondary fw-bold bg-cyan-800 px-6 btn-outline-primary mt-10 ">Submit</button>
                    
            </form>
        </div>
    </div>
   
    
</body>
</html>
